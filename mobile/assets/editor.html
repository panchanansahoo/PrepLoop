<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body, html, #container {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0F0F1A; /* matches Preploop theme.colors.bg */
        }
        
        /* Loading state */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #A0ADB8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(108, 99, 255, 0.3);
            border-radius: 50%;
            border-top-color: #6C63FF;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Editor...</div>
    </div>
    <div id="container"></div>

    <script>
        // Send messages back to React Native
        function sendMessage(type, payload) {
            window.ReactNativeWebView.postMessage(JSON.stringify({ type, payload }));
        }

        // Catch global errors
        window.onerror = function(message, source, lineno, colno, error) {
            sendMessage('ERROR', { message });
        };
    </script>

    <!-- Load Monaco Editor from CDN -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' } });

        require(['vs/editor/editor.main'], function() {
            // Hide loading indicator
            document.getElementById('loading').style.display = 'none';

            // Define custom Preploop Dark theme
            monaco.editor.defineTheme('preploop-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { background: '0F0F1A' },
                    { token: 'comment', foreground: '64748b', fontStyle: 'italic' },
                    { token: 'keyword', foreground: 'c586c0' },
                    { token: 'string', foreground: 'ce9178' },
                ],
                colors: {
                    'editor.background': '#0F0F1A',
                    'editor.lineHighlightBackground': '#1A1A2E',
                    'editorLineNumber.foreground': '#475569',
                    'editorIndentGuide.background': '#1e293b',
                    'editor.selectionBackground': '#264f78',
                }
            });

            // Initialize editor
            window.editor = monaco.editor.create(document.getElementById('container'), {
                value: '// Start coding here...',
                language: 'javascript',
                theme: 'preploop-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                scrollBeyondLastLine: false,
                fontSize: 14,
                fontFamily: 'Menlo, Monaco, "Courier New", monospace',
                lineHeight: 22,
                padding: { top: 16, bottom: 16 },
                wordWrap: 'on',
                renderLineHighlight: 'all',
                hideCursorInOverviewRuler: true,
                scrollbar: {
                    verticalScrollbarSize: 6,
                    horizontalScrollbarSize: 6
                }
            });

            // Notify RN that editor is ready
            sendMessage('READY', null);

            // Listen for content changes and send to RN
            window.editor.onDidChangeModelContent(function() {
                const value = window.editor.getValue();
                sendMessage('CHANGE', { code: value });
            });

            // Handle messages from React Native
            document.addEventListener('message', function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'SET_CODE') {
                        if (window.editor.getValue() !== data.payload.code) {
                            window.editor.setValue(data.payload.code);
                        }
                    } else if (data.type === 'SET_LANGUAGE') {
                        monaco.editor.setModelLanguage(window.editor.getModel(), data.payload.language);
                    }
                } catch (e) {
                    sendMessage('ERROR', { message: 'Failed to parse message from RN' });
                }
            });
            
            // iOS window.postMessage compatibility
            window.addEventListener('message', function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'SET_CODE') {
                        if (window.editor.getValue() !== data.payload.code) {
                            window.editor.setValue(data.payload.code);
                        }
                    } else if (data.type === 'SET_LANGUAGE') {
                        monaco.editor.setModelLanguage(window.editor.getModel(), data.payload.language);
                    }
                } catch (e) {
                    // Ignore non-JSON messages (like webpack HMR)
                }
            });
        });
    </script>
</body>
</html>
