name: Feature request
description: Suggest an idea or enhancement for PrepLoop.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

  - type: input
    id: problem
    attributes:
      label: Problem statement
      description: What user pain point are you trying to solve?
      placeholder: It is hard to compare progress across tracks.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your ideal solution.
      placeholder: Add a unified progress dashboard with filters.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other options you considered?

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Frontend
        - Backend
        - Data/Content
        - CI/CD
        - Docs
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (optional)
      description: Add measurable outcomes if possible.
      placeholder: |
        - Users can filter progress by topic and difficulty
        - Dashboard loads in under 2s on broadband

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
