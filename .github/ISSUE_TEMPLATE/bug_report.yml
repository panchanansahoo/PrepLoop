name: Bug report
description: Report a reproducible bug to help us improve PrepLoop.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the bug.
      placeholder: App crashes when opening the code editor
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include clear steps so we can reproduce the issue.
      placeholder: |
        1. Go to Dashboard
        2. Click a DSA problem
        3. Open code editor
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The editor should load normally.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Blank page with console error.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Commit SHA, branch, or release tag if known.
      placeholder: main @ abc1234

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Frontend
        - Backend
        - Data/Content
        - CI/CD
        - Docs
        - Unknown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste error logs, stack traces, or screenshots.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reproduce this issue consistently.
          required: true
