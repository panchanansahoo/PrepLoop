name: Documentation request
description: Request documentation updates or report missing/unclear docs.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: area
    attributes:
      label: Documentation area
      description: Which file/section is affected?
      placeholder: README.md -> Getting Started
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is unclear or missing?
      placeholder: Setup instructions do not mention required env keys.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      placeholder: Add a minimal `.env.example` section and validation script.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
