name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect DSA Editor Changes
    runs-on: ubuntu-latest
    outputs:
      dsa_editor: ${{ steps.filter.outputs.dsa_editor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dsa_editor:
              - 'backend/routes/dsa.js'
              - 'backend/routes/practice.js'
              - 'backend/utils/executeCode.js'
              - 'backend/scripts/smokeDsaCodeEditor.js'
              - 'backend/package.json'
              - 'backend/package-lock.json'
              - '.github/workflows/ci.yml'

  validate:
    name: Validate Backend + Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/contracts/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install and build contracts
        run: |
          npm ci --prefix packages/contracts
          npm run build --prefix packages/contracts

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install mobile dependencies
        if: hashFiles('mobile/package-lock.json') != ''
        run: npm ci --prefix mobile

      - name: Backend type check
        run: npm run type-check --prefix backend

      - name: Backend lint
        run: npm run lint --prefix backend

      - name: Backend tests
        timeout-minutes: 10
        run: npm run test:ci --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/preploop_test
          NODE_ENV: test
          PORT: 5000
          FRONTEND_URL: http://localhost:5173
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          JWT_SECRET: test-jwt-secret-key-with-32-characters
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "true"

      - name: Backend startup & health smoke test
        timeout-minutes: 5
        run: npm run test:boot --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/preploop_test
          NODE_ENV: test
          PORT: 5000
          FRONTEND_URL: http://localhost:5173
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          JWT_SECRET: test-jwt-secret-key-with-32-characters

      - name: Frontend unit & component tests
        timeout-minutes: 10
        run: npm run test:ci --prefix frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "true"

      - name: Mobile unit tests
        run: npm test --prefix mobile

      - name: Mobile lint
        if: hashFiles('mobile/node_modules/eslint/bin/eslint.js') != ''
        run: npm run lint --prefix mobile

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Frontend bundle budget check
        run: npm run check:bundle --prefix frontend

      - name: Dependency security advisory audit
        run: |
          npm audit --omit=dev --audit-level=high --prefix backend
          npm audit --omit=dev --audit-level=high --prefix frontend

  dsa-editor-smoke:
    name: DSA Editor Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate
      - changes
    if: ${{ needs.changes.outputs.dsa_editor == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and build contracts
        run: |
          npm ci --prefix packages/contracts
          npm run build --prefix packages/contracts

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Start backend
        shell: bash
        run: |
          nohup npm run start --prefix backend > backend.log 2>&1 &
          echo $! > backend.pid
        env:
          NODE_ENV: test
          PORT: 5000
          FRONTEND_URL: http://localhost:5173
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          JWT_SECRET: test-jwt-secret-key-with-32-characters

      - name: Wait for backend health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become healthy"
          tail -n 200 backend.log || true
          exit 1

      - name: Run DSA editor smoke test
        run: npm run smoke:dsa-editor --prefix backend
        env:
          SUPABASE_URL: https://example.supabase.co

      - name: Backend log on failure
        if: failure()
        shell: bash
        run: tail -n 200 backend.log || true

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

  e2e-smoke:
    name: Playwright E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build contracts
        run: |
          npm ci --prefix packages/contracts
          npm run build --prefix packages/contracts

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke tests
        working-directory: frontend
        run: npx playwright test tests/e2e/public-smoke.spec.js tests/e2e/critical-flows.spec.js --project=chromium
        env:
          CI: true


