name: Security & Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly security scan on Monday at 6 AM UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # --- Job 1: Dependency Audit ---
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend audit (must have 0 critical/high)
        run: |
          cd backend
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Frontend audit (informational)
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=critical
        continue-on-error: true

  # --- Job 2: Secrets Detection ---
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run project secrets scanner
        run: |
          cd backend && npm ci --ignore-scripts
          node ../scripts/scan-secrets.js || true

      - name: Check for hardcoded secret patterns in tracked files
        run: |
          FOUND=0
          # Groq API keys
          if git grep -lI 'gsk_[a-zA-Z0-9]\{20,\}' -- '*.js' '*.ts' '*.json' ':!**/package-lock.json' ':!**/node_modules/**' 2>/dev/null; then
            echo "::error::Hardcoded Groq API key detected!"
            FOUND=1
          fi
          # Razorpay LIVE keys (test keys are acceptable)
          if git grep -lI 'rzp_live_[a-zA-Z0-9]\{10,\}' -- '*.js' '*.ts' '*.json' ':!**/package-lock.json' ':!**/node_modules/**' 2>/dev/null; then
            echo "::error::Hardcoded Razorpay live key detected!"
            FOUND=1
          fi
          # OpenAI/Anthropic keys
          if git grep -lI 'sk-[a-zA-Z0-9]\{40,\}' -- '*.js' '*.ts' '*.json' ':!**/package-lock.json' ':!**/node_modules/**' 2>/dev/null; then
            echo "::error::Hardcoded API key (sk-) detected!"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "✅ No hardcoded secrets found in tracked files"

  # --- Job 3: Code Quality ---
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint backend
        run: |
          cd backend
          npm ci --ignore-scripts
          npx eslint . --max-warnings=0 || true

      - name: Lint frontend
        run: |
          cd frontend
          npm ci --ignore-scripts
          npx eslint . --max-warnings=0 || true

  # --- Job 4: Test Suite ---
  tests:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [dependency-audit, code-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install all dependencies
        run: |
          cd backend && npm ci --ignore-scripts
          cd ../frontend && npm ci

      - name: Verify backend syntax
        run: |
          cd backend
          node --check index.js

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --run

  # --- Job 5: Docker Security (main branch only) ---
  docker-security:
    name: Docker Security
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t preploop-backend:scan --target backend .

      - name: Verify non-root user
        run: |
          USER=$(docker run --rm preploop-backend:scan whoami 2>/dev/null || echo "unknown")
          if [ "$USER" = "root" ]; then
            echo "::error::Container is running as root!"
            exit 1
          fi
          echo "✅ Container runs as: $USER"

      - name: Verify Node.js version
        run: |
          NODE_VER=$(docker run --rm preploop-backend:scan node --version)
          echo "Node.js version in container: $NODE_VER"
          if echo "$NODE_VER" | grep -q "v18"; then
            echo "::warning::Node.js 18 is EOL — upgrade required"
          fi
