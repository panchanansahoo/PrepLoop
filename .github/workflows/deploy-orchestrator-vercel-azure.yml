name: Deploy Orchestrator (Azure Backend -> Vercel Frontend)

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-orchestrator-vercel-azure.yml'
      - '.github/workflows/deploy-backend-azure.yml'
      - '.github/workflows/deploy-frontend-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend First
    uses: ./.github/workflows/deploy-backend-azure.yml
    secrets: inherit

  deploy-frontend:
    name: Deploy Frontend After Backend
    needs: deploy-backend
    uses: ./.github/workflows/deploy-frontend-vercel.yml
    secrets: inherit
