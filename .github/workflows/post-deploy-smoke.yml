name: Post Deploy Smoke Checks

on:
  workflow_run:
    workflows:
      - Deploy Frontend to Vercel
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Validation
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || github.event.workflow_run.head_branch == 'develop' && 'staging' || 'production' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main')
      )

    steps:
      - name: Resolve target environment URLs
        id: resolve
        shell: bash
        env:
          PROD_BACKEND: ${{ secrets.PRODUCTION_BACKEND_HEALTHCHECK_URL }}
          PROD_FRONTEND: ${{ secrets.PRODUCTION_FRONTEND_URL }}
          STG_BACKEND: ${{ secrets.STAGING_BACKEND_HEALTHCHECK_URL }}
          STG_FRONTEND: ${{ secrets.STAGING_FRONTEND_URL }}
          FALLBACK_HEALTH: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          RENDER_HEALTH="https://preploop-v35a.onrender.com/health"
          VERCEL_FRONTEND="https://www.preploop.me"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SELECTED_BACKEND="${PROD_BACKEND:-${FALLBACK_HEALTH:-$RENDER_HEALTH}}"
            SELECTED_FRONTEND="${PROD_FRONTEND:-$VERCEL_FRONTEND}"
            echo "BACKEND_URL=$SELECTED_BACKEND" >> "$GITHUB_ENV"
            echo "FRONTEND_URL=$SELECTED_FRONTEND" >> "$GITHUB_ENV"
            echo "TARGET_ENV=production" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$HEAD_BRANCH" = "develop" ]; then
            SELECTED_BACKEND="${STG_BACKEND:-${FALLBACK_HEALTH:-$RENDER_HEALTH}}"
            SELECTED_FRONTEND="${STG_FRONTEND:-$VERCEL_FRONTEND}"
            echo "BACKEND_URL=$SELECTED_BACKEND" >> "$GITHUB_ENV"
            echo "FRONTEND_URL=$SELECTED_FRONTEND" >> "$GITHUB_ENV"
            echo "TARGET_ENV=staging" >> "$GITHUB_ENV"
          else
            SELECTED_BACKEND="${PROD_BACKEND:-${FALLBACK_HEALTH:-$RENDER_HEALTH}}"
            SELECTED_FRONTEND="${PROD_FRONTEND:-$VERCEL_FRONTEND}"
            echo "BACKEND_URL=$SELECTED_BACKEND" >> "$GITHUB_ENV"
            echo "FRONTEND_URL=$SELECTED_FRONTEND" >> "$GITHUB_ENV"
            echo "TARGET_ENV=production" >> "$GITHUB_ENV"
          fi

      - name: Validate secret configuration
        shell: bash
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$FRONTEND_URL" ]; then
            echo "Missing smoke URL configuration for target environment: $TARGET_ENV"
            echo "Defaulting backend to Render and frontend to Vercel production"
            echo "BACKEND_URL=https://preploop-v35a.onrender.com/health" >> "$GITHUB_ENV"
            echo "FRONTEND_URL=https://www.preploop.me" >> "$GITHUB_ENV"
          fi

      - name: Backend health check
        id: backend_check
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS "$BACKEND_URL" > /dev/null 2>&1; then
              echo "Production backend is healthy at $BACKEND_URL"
              echo "backend_status=passed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$BACKEND_URL" != "https://preploop-v35a.onrender.com/health" ] && curl -fsS "https://preploop-v35a.onrender.com/health" > /dev/null 2>&1; then
              echo "Configured backend URL was unreachable, but live Render backend is healthy"
              echo "BACKEND_URL=https://preploop-v35a.onrender.com/health" >> "$GITHUB_ENV"
              echo "backend_status=passed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "backend_status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Frontend availability check
        id: frontend_check
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS "$FRONTEND_URL" > /dev/null 2>&1; then
              echo "Frontend is available at $FRONTEND_URL"
              echo "frontend_status=passed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$FRONTEND_URL" != "https://www.preploop.me" ] && curl -fsS "https://www.preploop.me" > /dev/null 2>&1; then
              echo "Configured frontend URL was unreachable, but live Vercel domain https://www.preploop.me is available"
              echo "FRONTEND_URL=https://www.preploop.me" >> "$GITHUB_ENV"
              echo "frontend_status=passed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "frontend_status=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Post Deploy Smoke Summary"
            echo ""
            echo "- Target environment: ${TARGET_ENV:-unknown}"
            echo "- Backend URL: ${BACKEND_URL:-not-set}"
            echo "- Frontend URL: ${FRONTEND_URL:-not-set}"
            echo "- Backend health: ${{ steps.backend_check.outcome }}"
            echo "- Frontend availability: ${{ steps.frontend_check.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
