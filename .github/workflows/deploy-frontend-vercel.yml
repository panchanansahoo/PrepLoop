name: Deploy Frontend to Vercel

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build contracts
        run: |
          npm ci --prefix packages/contracts
          npm run build --prefix packages/contracts

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend tests
        run: npm run test --prefix frontend

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Check frontend bundle budget
        run: npm run check:bundle --prefix frontend

      - name: Install Chromium for smoke tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Public route smoke tests
        run: npm run test:e2e --prefix frontend -- tests/e2e/public-smoke.spec.js --project=chromium

      - name: Accessibility and mobile smoke tests
        continue-on-error: true
        run: npm run test:e2e:a11y --prefix frontend

  deploy-staging:
    name: Deploy Frontend Staging
    runs-on: ubuntu-latest
    needs: validate-frontend
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve staging backend health URL
        shell: bash
        env:
          STAGING_HEALTH: ${{ secrets.STAGING_BACKEND_HEALTHCHECK_URL }}
          FALLBACK_HEALTH: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          HEALTH_URL="${STAGING_HEALTH:-${FALLBACK_HEALTH:-https://preploop-v35a.onrender.com/health}}"
          EFFECTIVE_SUPABASE_URL="${VITE_SUPABASE_URL:-$SUPABASE_URL}"
          EFFECTIVE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-$SUPABASE_ANON_KEY}"
          if [ -z "$EFFECTIVE_SUPABASE_URL" ] || [ -z "$EFFECTIVE_SUPABASE_ANON_KEY" ]; then
            echo "Missing staging frontend Supabase secrets"
            echo "Set VITE_SUPABASE_URL (or SUPABASE_URL) and VITE_SUPABASE_ANON_KEY (or SUPABASE_ANON_KEY)"
            exit 1
          fi
          API_ORIGIN="$(python3 -c 'from urllib.parse import urlsplit; import sys; u=sys.argv[1].strip(); p=urlsplit(u); print(f"{p.scheme}://{p.netloc}")' "$HEALTH_URL")"
          echo "BACKEND_HEALTH_URL=$HEALTH_URL" >> "$GITHUB_ENV"
          echo "VITE_API_URL=$API_ORIGIN" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$EFFECTIVE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$EFFECTIVE_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify backend is healthy (staging)
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS "$BACKEND_HEALTH_URL" > /dev/null 2>&1; then
              echo "Staging backend is healthy at $BACKEND_HEALTH_URL"
              exit 0
            fi
            if [ "$BACKEND_HEALTH_URL" != "https://preploop-v35a.onrender.com/health" ] && curl -fsS "https://preploop-v35a.onrender.com/health" > /dev/null 2>&1; then
              echo "Primary health check failed, but live Render backend is healthy"
              echo "BACKEND_HEALTH_URL=https://preploop-v35a.onrender.com/health" >> "$GITHUB_ENV"
              echo "VITE_API_URL=https://preploop-v35a.onrender.com" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "Staging backend health check failed"
          exit 1

      - name: Install and build contracts
        run: |
          npm ci --prefix packages/contracts
          npm run build --prefix packages/contracts

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Reset Vercel link
        working-directory: frontend
        run: rm -rf .vercel

      - name: Pull Vercel project settings (preview)
        working-directory: frontend
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build frontend artifacts (preview)
        working-directory: frontend
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel preview
        working-directory: frontend
        run: vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    name: Deploy Frontend Production
    runs-on: ubuntu-latest
    needs: validate-frontend
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve production backend health URL
        shell: bash
        env:
          PROD_HEALTH: ${{ secrets.PRODUCTION_BACKEND_HEALTHCHECK_URL }}
          FALLBACK_HEALTH: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          HEALTH_URL="${PROD_HEALTH:-${FALLBACK_HEALTH:-https://preploop-v35a.onrender.com/health}}"
          EFFECTIVE_SUPABASE_URL="${VITE_SUPABASE_URL:-$SUPABASE_URL}"
          EFFECTIVE_SUPABASE_ANON_KEY="${VITE_SUPABASE_ANON_KEY:-$SUPABASE_ANON_KEY}"
          if [ -z "$EFFECTIVE_SUPABASE_URL" ] || [ -z "$EFFECTIVE_SUPABASE_ANON_KEY" ]; then
            echo "Missing production frontend Supabase secrets"
            echo "Set VITE_SUPABASE_URL (or SUPABASE_URL) and VITE_SUPABASE_ANON_KEY (or SUPABASE_ANON_KEY)"
            exit 1
          fi
          API_ORIGIN="$(python3 -c 'from urllib.parse import urlsplit; import sys; u=sys.argv[1].strip(); p=urlsplit(u); print(f"{p.scheme}://{p.netloc}")' "$HEALTH_URL")"
          echo "BACKEND_HEALTH_URL=$HEALTH_URL" >> "$GITHUB_ENV"
          echo "VITE_API_URL=$API_ORIGIN" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$EFFECTIVE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$EFFECTIVE_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify backend is healthy (production)
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS "$BACKEND_HEALTH_URL" > /dev/null 2>&1; then
              echo "Production backend is healthy at $BACKEND_HEALTH_URL"
              exit 0
            fi
            if [ "$BACKEND_HEALTH_URL" != "https://preploop-v35a.onrender.com/health" ] && curl -fsS "https://preploop-v35a.onrender.com/health" > /dev/null 2>&1; then
              echo "Primary health check failed, but live Render production backend is healthy"
              echo "BACKEND_HEALTH_URL=https://preploop-v35a.onrender.com/health" >> "$GITHUB_ENV"
              echo "VITE_API_URL=https://preploop-v35a.onrender.com" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "Production backend health check failed"
          exit 1

      - name: Install and build contracts
        run: |
          npm ci --prefix packages/contracts
          npm run build --prefix packages/contracts

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Reset Vercel link
        working-directory: frontend
        run: rm -rf .vercel

      - name: Pull Vercel project settings (production)
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build frontend artifacts (production)
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ env.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel production
        working-directory: frontend
        run: vercel deploy --prebuilt --yes --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
