name: Azure Web App CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        run: |
          npm run build --prefix frontend

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'REPLACE_WITH_YOUR_APP_NAME' # set your Azure Web App name here
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './frontend'

# Notes:
# - Create secret AZURE_WEBAPP_PUBLISH_PROFILE in the repository (paste raw publish profile XML)
# - Replace app-name above with your Azure Web App name or set it via repository secret and reference here.
