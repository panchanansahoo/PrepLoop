# This workflow was auto-generated by Azure and is now superseded by:
#   - deploy-orchestrator-vercel-azure.yml (orchestrates backend + frontend)
#   - deploy-backend-azure.yml (backend-only deploy)
#
# Kept as manual-only for emergency rollbacks.

name: "[Legacy] Azure Staging Direct Deploy"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DAAC6AA6E0AF4BBCA45013FB24994D12 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F83FC2F4F5464371B3FC63E64E7132EE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5CCE71B12CD24400AB7E13CE3A3691D4 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'preploop-api-staging'
          slot-name: 'Production'
          package: .
