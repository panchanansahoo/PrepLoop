name: Deploy Backend to Azure

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Backend lint
        run: npm run lint --prefix backend

      - name: Backend tests
        run: npm run test --prefix backend

  deploy-staging:
    name: Deploy Backend Staging
    runs-on: ubuntu-latest
    needs: validate-backend
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve staging health URL
        shell: bash
        run: |
          HEALTH_URL="${{ secrets.STAGING_BACKEND_HEALTHCHECK_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="${{ secrets.BACKEND_HEALTHCHECK_URL }}"
          fi
          if [ -z "$HEALTH_URL" ]; then
            echo "Missing staging backend health URL secret"
            echo "Set STAGING_BACKEND_HEALTHCHECK_URL (preferred) or BACKEND_HEALTHCHECK_URL"
            exit 1
          fi
          echo "BACKEND_HEALTH_URL=$HEALTH_URL" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Deploy to Azure Web App (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend

      - name: Health check (staging)
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS "$BACKEND_HEALTH_URL" > /dev/null; then
              echo "Staging backend health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Staging backend health check failed"
          exit 1

  deploy-production:
    name: Deploy Backend Production
    runs-on: ubuntu-latest
    needs: validate-backend
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve production health URL
        shell: bash
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_BACKEND_HEALTHCHECK_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="${{ secrets.BACKEND_HEALTHCHECK_URL }}"
          fi
          if [ -z "$HEALTH_URL" ]; then
            echo "Missing production backend health URL secret"
            echo "Set PRODUCTION_BACKEND_HEALTHCHECK_URL (preferred) or BACKEND_HEALTHCHECK_URL"
            exit 1
          fi
          echo "BACKEND_HEALTH_URL=$HEALTH_URL" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Deploy to Azure Web App (production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend

      - name: Health check (production)
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS "$BACKEND_HEALTH_URL" > /dev/null; then
              echo "Production backend health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Production backend health check failed"
          exit 1
