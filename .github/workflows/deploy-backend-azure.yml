name: Deploy Backend to Azure

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Backend lint
        run: npm run lint --prefix backend

      - name: Backend tests
        run: npm run test --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/preploop_test
          NODE_ENV: test
          PORT: 5000
          FRONTEND_URL: http://localhost:5173
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          JWT_SECRET: test-jwt-secret-key-with-32-characters

  deploy-staging:
    name: Deploy Backend Staging
    runs-on: ubuntu-latest
    needs: validate-backend
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve staging health URL
        shell: bash
        run: |
          HEALTH_URL="${{ secrets.STAGING_BACKEND_HEALTHCHECK_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="${{ secrets.BACKEND_HEALTHCHECK_URL }}"
          fi
          if [ -z "$HEALTH_URL" ]; then
            echo "Missing staging backend health URL secret"
            echo "Set STAGING_BACKEND_HEALTHCHECK_URL (preferred) or BACKEND_HEALTHCHECK_URL"
            exit 1
          fi
          echo "BACKEND_HEALTH_URL=$HEALTH_URL" >> "$GITHUB_ENV"

      - name: Resolve staging Azure deployment target
        id: resolve_staging_azure
        shell: bash
        run: |
          APP_NAME="${{ secrets.STAGING_AZURE_WEBAPP_NAME }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="${{ secrets.AZURE_WEBAPP_NAME }}"
          fi

          PUBLISH_PROFILE="${{ secrets.STAGING_AZURE_WEBAPP_PUBLISH_PROFILE }}"
          if [ -z "$PUBLISH_PROFILE" ]; then
            PUBLISH_PROFILE="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
          fi

          if [ -z "$APP_NAME" ] || [ -z "$PUBLISH_PROFILE" ]; then
            echo "Missing staging Azure deployment secrets"
            echo "Set STAGING_AZURE_WEBAPP_NAME / STAGING_AZURE_WEBAPP_PUBLISH_PROFILE (preferred),"
            echo "or AZURE_WEBAPP_NAME / AZURE_WEBAPP_PUBLISH_PROFILE as fallback."
            exit 1
          fi

          {
            echo "app_name=$APP_NAME"
            echo "publish_profile<<EOF"
            echo "$PUBLISH_PROFILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Deploy to Azure Web App (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve_staging_azure.outputs.app_name }}
          publish-profile: ${{ steps.resolve_staging_azure.outputs.publish_profile }}
          package: ./backend

      - name: Health check (staging)
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS "$BACKEND_HEALTH_URL" > /dev/null; then
              echo "Staging backend health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Staging backend health check failed"
          exit 1

  deploy-production:
    name: Deploy Backend Production
    runs-on: ubuntu-latest
    needs: validate-backend
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve production health URL
        shell: bash
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_BACKEND_HEALTHCHECK_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="${{ secrets.BACKEND_HEALTHCHECK_URL }}"
          fi
          if [ -z "$HEALTH_URL" ]; then
            echo "Missing production backend health URL secret"
            echo "Set PRODUCTION_BACKEND_HEALTHCHECK_URL (preferred) or BACKEND_HEALTHCHECK_URL"
            exit 1
          fi
          echo "BACKEND_HEALTH_URL=$HEALTH_URL" >> "$GITHUB_ENV"

      - name: Resolve production Azure deployment target
        id: resolve_production_azure
        shell: bash
        run: |
          APP_NAME="${{ secrets.PRODUCTION_AZURE_WEBAPP_NAME }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="${{ secrets.AZURE_WEBAPP_NAME }}"
          fi

          PUBLISH_PROFILE="${{ secrets.PRODUCTION_AZURE_WEBAPP_PUBLISH_PROFILE }}"
          if [ -z "$PUBLISH_PROFILE" ]; then
            PUBLISH_PROFILE="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
          fi

          if [ -z "$APP_NAME" ] || [ -z "$PUBLISH_PROFILE" ]; then
            echo "Missing production Azure deployment secrets"
            echo "Set PRODUCTION_AZURE_WEBAPP_NAME / PRODUCTION_AZURE_WEBAPP_PUBLISH_PROFILE (preferred),"
            echo "or AZURE_WEBAPP_NAME / AZURE_WEBAPP_PUBLISH_PROFILE as fallback."
            exit 1
          fi

          {
            echo "app_name=$APP_NAME"
            echo "publish_profile<<EOF"
            echo "$PUBLISH_PROFILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Deploy to Azure Web App (production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve_production_azure.outputs.app_name }}
          publish-profile: ${{ steps.resolve_production_azure.outputs.publish_profile }}
          package: ./backend

      - name: Health check (production)
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS "$BACKEND_HEALTH_URL" > /dev/null; then
              echo "Production backend health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Production backend health check failed"
          exit 1
