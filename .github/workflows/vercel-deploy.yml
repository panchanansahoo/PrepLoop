name: Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  vercel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-arg: '--prod'
          working-directory: './frontend'

# Notes:
# - Set repository secret VERCEL_TOKEN (create from Vercel dashboard)
# - Optionally set VERCEL_ORG_ID and VERCEL_PROJECT_ID as secrets and pass them here if required by your Vercel setup
# - This action deploys the frontend directory to Vercel on push to main
