<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PrepLoop — AI-powered interview preparation platform. Master DSA, System Design, SQL, and behavioral interviews with real-time voice AI coaching. 500+ problems, company-specific prep, and instant feedback." />
  <meta name="keywords" content="interview prep, coding interview, DSA practice, system design, mock interview, AI interview coach, LeetCode alternative, technical interview, SQL practice, resume analyzer" />
  <meta name="author" content="PrepLoop" />
  <meta name="theme-color" content="#050507" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.preploop.me/" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.preploop.me/" />
  <meta property="og:title" content="PrepLoop — AI-Powered Interview Prep Platform" />
  <meta property="og:description" content="Master coding interviews with AI-powered mock interviews, 500+ DSA problems, system design simulators, and real-time voice coaching. Join 15,000+ engineers." />
  <meta property="og:site_name" content="PrepLoop" />
  <meta property="og:image" content="https://www.preploop.me/favicon.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PrepLoop — AI-Powered Interview Prep Platform" />
  <meta name="twitter:description" content="Master coding interviews with AI-powered mock interviews, 500+ DSA problems, and real-time voice coaching. Join 15,000+ engineers." />
  <meta name="twitter:image" content="https://www.preploop.me/favicon.svg" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "PrepLoop",
    "url": "https://www.preploop.me",
    "description": "AI-powered interview preparation platform with mock interviews, DSA practice, system design simulators, and real-time voice coaching.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "offers": [
      { "@type": "Offer", "price": "0", "priceCurrency": "INR", "name": "Starter" },
      { "@type": "Offer", "price": "99", "priceCurrency": "INR", "name": "Pro" },
      { "@type": "Offer", "price": "299", "priceCurrency": "INR", "name": "Premium" }
    ],
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "1200"
    }
  }
  </script>

  <title>PrepLoop — AI Interview Prep Platform | DSA, System Design & Mock Interviews</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

  <!-- Performance: Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Performance: DNS prefetch for API -->
  <link rel="dns-prefetch" href="https://api.preploop.me">

  <!-- CRITICAL FONTS ONLY: Inter (body) — loaded immediately for FCP/LCP -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
    crossorigin="anonymous">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  </noscript>

  <!-- SECONDARY FONTS: Lazy-loaded after page interactive — JetBrains Mono (code), Instrument Sans (UI), Outfit (headings) -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@500;600;700&family=Outfit:wght@300;500;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
    media="print"
    crossorigin="anonymous">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@500;600;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  </noscript>

  <!-- Font loading monitoring and lazy initialization -->
  <script>
    // Lazy-load secondary fonts after page is interactive
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', lazyLoadFonts);
    } else {
      // DOMContentLoaded already fired
      setTimeout(lazyLoadFonts, 100);
    }

    function lazyLoadFonts() {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Sans:wght@500;600;700&family=Outfit:wght@300;500;700&display=swap';
      link.crossOrigin = 'anonymous';
      document.head.appendChild(link);
    }
  </script>

  <!-- Critical inline styles for initial paint (avoid CLS from layout shifts) -->
  <style>
    /* System font stack fallback for immediate rendering */
    html, body, #root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
      font-feature-settings: "kern" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Use Inter once loaded (with fallback to system fonts) */
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
    }

    /* Code editor uses JetBrains Mono (with Monaco default fallback) */
    .code-editor, pre, code {
      font-family: "JetBrains Mono", "Monaco", "Courier New", monospace;
    }

    /* Prevent FOUC: hide root until React hydrates, show loading skeleton */
    #root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #050507;
    }
    #root:empty::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Font containment for performance */
    @supports (font-display: swap) {
      /* Browser supports font-display, no additional styling needed */
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
