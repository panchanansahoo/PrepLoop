<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Mode Test</title>
  <style>
    :root {
      --bg-primary: #030303;
      --text-primary: #ffffff;
    }

    [data-theme="light"] {
      --bg-primary: #fafbfd;
      --text-primary: #1a1d2e;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: Arial, sans-serif;
      padding: 2rem;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 0.5rem;
      margin-bottom: 2rem;
    }

    button:hover {
      opacity: 0.8;
    }

    .info {
      background: rgba(255, 255, 255, 0.1);
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }

    [data-theme="light"] .info {
      background: rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Light Mode Test</h1>
    
    <button onclick="toggleTheme()">Toggle Theme</button>

    <div class="info">
      <p><strong>Current Theme:</strong> <span id="theme-display">dark</span></p>
      <p><strong>data-theme attribute:</strong> <span id="attr-display">not set</span></p>
      <p><strong>--bg-primary:</strong> <span id="bg-display">#030303</span></p>
      <p><strong>--text-primary:</strong> <span id="text-display">#ffffff</span></p>
    </div>

    <div class="info">
      <p>Click the button above to toggle between light and dark mode.</p>
      <p>The values above should change to show the current theme settings.</p>
      <p>Check your browser console for any errors.</p>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      
      updateDisplay();
    }

    function updateDisplay() {
      const html = document.documentElement;
      const theme = html.getAttribute('data-theme') || 'dark';
      const styles = getComputedStyle(html);
      const bgPrimary = styles.getPropertyValue('--bg-primary').trim();
      const textPrimary = styles.getPropertyValue('--text-primary').trim();
      
      document.getElementById('theme-display').textContent = theme;
      document.getElementById('attr-display').textContent = theme;
      document.getElementById('bg-display').textContent = bgPrimary;
      document.getElementById('text-display').textContent = textPrimary;

      console.log('Theme:', theme);
      console.log('--bg-primary:', bgPrimary);
      console.log('--text-primary:', textPrimary);
    }

    // Load saved theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    // Update display on load
    updateDisplay();
  </script>
</body>
</html>
