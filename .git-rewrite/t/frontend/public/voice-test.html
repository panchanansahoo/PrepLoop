<!DOCTYPE html>
<html>
<head>
    <title>Voice Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: #fff; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; cursor: pointer; }
        #status { margin: 20px 0; padding: 10px; background: #2a2a2a; border-radius: 5px; }
        #transcript { margin: 20px 0; padding: 10px; background: #2a2a2a; border-radius: 5px; min-height: 100px; }
        .error { color: #ff4444; }
        .success { color: #44ff44; }
    </style>
</head>
<body>
    <h1>Voice System Test</h1>
    
    <div id="status">Status: Ready</div>
    
    <button id="testMic">Test Microphone</button>
    <button id="testTTS">Test TTS (Speak "Hello")</button>
    <button id="testSTT">Test STT (Record 5s)</button>
    
    <div id="transcript">
        <strong>Transcript will appear here...</strong>
    </div>
    
    <audio id="audioPlayer" controls style="width: 100%; margin: 20px 0;"></audio>

    <script>
        const API_URL = 'http://localhost:5000';
        const status = document.getElementById('status');
        const transcript = document.getElementById('transcript');
        const audioPlayer = document.getElementById('audioPlayer');
        
        function log(msg, isError = false) {
            console.log(msg);
            status.innerHTML = `<span class="${isError ? 'error' : 'success'}">${msg}</span>`;
        }
        
        // Test 1: Microphone Access
        document.getElementById('testMic').onclick = async () => {
            try {
                log('Requesting microphone access...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('✓ Microphone access granted!');
                
                // Show audio levels
                const audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                source.connect(analyser);
                
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                let checkCount = 0;
                const checkLevel = () => {
                    analyser.getByteFrequencyData(dataArray);
                    const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                    log(`Microphone level: ${Math.round(average)} (speak to test)`);
                    
                    if (checkCount++ < 50) {
                        setTimeout(checkLevel, 100);
                    } else {
                        stream.getTracks().forEach(t => t.stop());
                        audioContext.close();
                        log('✓ Microphone test complete');
                    }
                };
                checkLevel();
            } catch (err) {
                log(`✗ Microphone error: ${err.message}`, true);
            }
        };
        
        // Test 2: TTS
        document.getElementById('testTTS').onclick = async () => {
            try {
                log('Testing TTS...');
                const res = await fetch(`${API_URL}/api/voice/tts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: 'Hello, this is a test of the text to speech system.',
                        persona: 'friendly',
                        gender: 'female'
                    })
                });
                
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }
                
                const contentType = res.headers.get('content-type');
                log(`TTS response: ${contentType}`);
                
                if (contentType && contentType.includes('audio')) {
                    const blob = await res.blob();
                    log(`✓ Got audio blob: ${blob.size} bytes`);
                    const url = URL.createObjectURL(blob);
                    audioPlayer.src = url;
                    audioPlayer.play();
                } else {
                    const data = await res.json();
                    if (data.fallback) {
                        log('Backend returned fallback - using browser TTS', true);
                        const utterance = new SpeechSynthesisUtterance('Hello, this is a test of the text to speech system.');
                        speechSynthesis.speak(utterance);
                    }
                }
            } catch (err) {
                log(`✗ TTS error: ${err.message}`, true);
            }
        };
        
        // Test 3: STT
        document.getElementById('testSTT').onclick = async () => {
            try {
                log('Starting 5 second recording...');
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };
                
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    log(`Recorded ${blob.size} bytes, sending to STT...`);
                    
                    const formData = new FormData();
                    formData.append('audio', blob, 'test.webm');
                    formData.append('mimeType', 'audio/webm');
                    
                    try {
                        const res = await fetch(`${API_URL}/api/voice/stt-chunk`, {
                            method: 'POST',
                            body: formData
                        });
                        
                        const data = await res.json();
                        if (data.transcript) {
                            log('✓ STT successful!');
                            transcript.innerHTML = `<strong>Transcript:</strong><br>${data.transcript}<br><br>Confidence: ${Math.round(data.confidence * 100)}%`;
                        } else if (data.fallback) {
                            log('Backend returned fallback', true);
                            transcript.innerHTML = '<strong>STT not available - backend returned fallback</strong>';
                        } else {
                            log('No transcript received', true);
                            transcript.innerHTML = `<strong>Response:</strong><br>${JSON.stringify(data)}`;
                        }
                    } catch (err) {
                        log(`✗ STT error: ${err.message}`, true);
                    }
                };
                
                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 5000);
                
            } catch (err) {
                log(`✗ Recording error: ${err.message}`, true);
            }
        };
    </script>
</body>
</html>
