apiVersion: v1
kind: Namespace
metadata:
  name: preploop

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: preploop-config
  namespace: preploop
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_POOL_MAX: "20"
  DB_POOL_MIN: "2"

---
apiVersion: v1
kind: Secret
metadata:
  name: preploop-secrets
  namespace: preploop
type: Opaque
stringData:
  SUPABASE_URL: "your-supabase-url"
  SUPABASE_ANON_KEY: "your-supabase-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "your-supabase-service-role-key"
  GROQ_API_KEY: "your-groq-api-key"
  RAZORPAY_KEY_ID: "your-razorpay-key-id"
  RAZORPAY_KEY_SECRET: "your-razorpay-key-secret"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preploop-backend
  namespace: preploop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: preploop-backend
  template:
    metadata:
      labels:
        app: preploop-backend
    spec:
      containers:
      - name: backend
        image: preploop/backend:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: preploop-config
        - secretRef:
            name: preploop-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: preploop-backend-service
  namespace: preploop
spec:
  selector:
    app: preploop-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preploop-frontend
  namespace: preploop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: preploop-frontend
  template:
    metadata:
      labels:
        app: preploop-frontend
    spec:
      containers:
      - name: frontend
        image: preploop/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: preploop-frontend-service
  namespace: preploop
spec:
  selector:
    app: preploop-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: preploop-backend-hpa
  namespace: preploop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: preploop-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: preploop-ingress
  namespace: preploop
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - preploop.com
    - www.preploop.com
    secretName: preploop-tls
  rules:
  - host: preploop.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: preploop-backend-service
            port:
              number: 5000
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: preploop-backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: preploop-frontend-service
            port:
              number: 80
